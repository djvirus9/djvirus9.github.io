title: "Danish Siddiqui | Senior Product Security Engineer"
description: "Danish Siddiqui builds product security programs across AppSec, AWS, Kubernetes, and DevSecOps. Explore engineering case studies and published vulnerability research."
url: "https://djvirus9.github.io"
baseurl: ""
repository: "djvirus9/djvirus9.github.io"
locale: "en-US"
logo: "/assets/avatar-224.jpg"
og_image: "/assets/social-preview.png"
timezone: Asia/Kolkata

social:
  name: "Danish Siddiqui"
  links:
    - "https://www.linkedin.com/in/djvirus9"
    - "https://github.com/djvirus9"
    - "https://bugcrowd.com/djvirus"
    - "https://yeswehack.com/hunters/djvirus"

remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "air"

plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
highlighter: rouge

permalink: /:categories/:title/

include:
  - _pages

exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - docs
  - scripts
  - artifacts
  - .github

author:
  name: "Danish Siddiqui"
  avatar: "/assets/avatar-224.jpg"
  bio: "CKA- and CKS-certified Senior Product Security Engineer — AppSec, AWS and Kubernetes Security, DevSecOps, ISO 27001, Bug Bounty, 22+ CVEs."
  location: "Bengaluru, India / Open globally"
  links:
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/djvirus9"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/djvirus9"
    - label: "Writing"
      icon: "fas fa-pen-nib"
      url: "/blog/"
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:danishismyname1@gmail.com"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: "case-studies"
    values:
      toc: true
      section: "Case study"
  - scope:
      path: "blog"
    values:
      toc: true
      section: "Writing"

breadcrumbs: true
search: false
atom_feed:
  hide: true
