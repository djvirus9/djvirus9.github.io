name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination _site

      - name: Check generated pages and links
        run: python3 scripts/check_site.py _site

      - name: Setup Python for browser checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-browser.txt

      - name: Install browser checks
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium webkit
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/axe-core@4.10.3/axe.min.js --output /tmp/portfolio-axe.js

      - name: Check interactive showcase and video
        run: python scripts/check_showcase.py _site --browsers chromium webkit --axe /tmp/portfolio-axe.js

      - name: Check sample triage workflow
        run: python scripts/check_secops.py _site --browsers chromium webkit --axe /tmp/portfolio-axe.js

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
