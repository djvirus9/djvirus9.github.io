{% for link in site.data.navigation.main %}
  {% assign active = false %}
  {% if page.url == link.url %}{% assign active = true %}{% elsif link.url != '/' and page.url contains link.url %}{% assign active = true %}{% endif %}
  <li><a href="{{ link.url | relative_url }}"{% if active %} aria-current="{% if page.url == link.url %}page{% else %}location{% endif %}"{% endif %}>{{ link.title }}</a></li>
{% endfor %}
